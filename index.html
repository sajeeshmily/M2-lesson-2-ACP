<!DOCTYPE html>
<html>

<head>
    <title>My Weather App</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Weather App</h1>
    <p class="tagline">Check the weather. Plan your day!</p>

    <!-- Main Weather Card -->
    <div class="weather-card">

        <h2>Today's Weather</h2>

        <h3>Mumbai</h3>

        <div class="weather-icon"></div>

        <h1 class="temperature">29°C</h1>

        <h3>Sunny Day</h3>

        <p>Feels like 31°C</p>

        <div class="weather-details">
            <p>Humidity: 65%</p>
            <p>Wind Speed: 12 km/h</p>
        </div>

    </div>

    <!-- Weekly Forecast -->
    <h2 class="forecast-title">Weekly Forecast</h2>

    <div class="forecast-container">

        <div class="day-card">
            <h3>Mon</h3>
            <p>☀️</p>
            <h3>30°C</h3>
        </div>

        <div class="day-card">
            <h3>Tue</h3>
            <p>🌧️</p>
            <h3>26°C</h3>
        </div>

        <div class="day-card">
            <h3>Wed</h3>
            <p>⛅</p>
            <h3>28°C</h3>
        </div>

        <div class="day-card">
            <h3>Thu</h3>
            <p>🌤️</p>
            <h3>29°C</h3>
        </div>

        <div class="day-card">
            <h3>Fri</h3>
            <p>🌧️</p>
            <h3>25°C</h3>
        </div>

    </div>

    <footer>
        <p>🌈 Have a wonderful day!</p>
    </footer>

</body>

</html>
